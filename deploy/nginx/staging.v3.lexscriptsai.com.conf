# Nginx configuration for staging.v3.lexscriptsai.com

# HTTP - Redirect to HTTPS
server {
    listen 80;
    listen [::]:80;
    server_name staging.v3.lexscriptsai.com;
    return 301 https://$host$request_uri;
}

# HTTPS - Staging Environment
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name staging.v3.lexscriptsai.com;

    # SSL configuration (managed by Certbot)
    ssl_certificate /etc/letsencrypt/live/staging.v3.lexscriptsai.com-0001/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/staging.v3.lexscriptsai.com-0001/privkey.pem;

    # Frontend static files (Vite build)
    root /var/www/staging.v3.lexscriptsai.com;
    index index.html;

    client_max_body_size 2048M;

    # Gzip compression
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript;

    # Frontend SPA routing
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Static assets cache
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
        expires 30d;
        add_header Cache-Control "public, no-transform";
    }

    # Backend REST API reverse proxy (Port 8081 for staging backend)
    location /api/ {
        proxy_pass http://127.0.0.1:8081/api/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Large file uploads support up to 2GB
        client_max_body_size 2048M;
        client_body_buffer_size 1M;
        client_body_timeout 1800s;
        proxy_read_timeout 1800s;
        proxy_connect_timeout 300s;
        proxy_send_timeout 1800s;
        proxy_request_buffering off;
        proxy_buffering off;
    }

    # WebSocket reverse proxy for real-time collaborative editing
    location /api/ws {
        proxy_pass http://127.0.0.1:8081/api/ws;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 86400s;
        proxy_send_timeout 86400s;
    }
}
